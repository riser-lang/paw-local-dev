name: Build Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Installer
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Standalone Installer (PyInstaller + Inno Setup)
        run: |
          python scripts/package_app.py

      - name: Generate Installer SHA256 Text File
        shell: pwsh
        run: |
          $exe = "dist/PAW_Personal_Work_OS_Setup_v2.3.9.exe"
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash
          "$hash  PAW_Personal_Work_OS_Setup_v2.3.9.exe" | Out-File -FilePath "dist/PAW_Personal_Work_OS_Setup_v2.3.9.exe.sha256" -Encoding ascii
          Get-Content "dist/PAW_Personal_Work_OS_Setup_v2.3.9.exe.sha256"

      - name: Upload Built Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAW_Personal_Work_OS_Setup_v2.3.9
          path: |
            dist/PAW_Personal_Work_OS_Setup_v2.3.9.exe
            dist/PAW_Personal_Work_OS_Setup_v2.3.9.exe.sha256
          if-no-files-found: error
