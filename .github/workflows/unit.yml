name: PAW Unit Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest httpx lxml
      - run: python -m pytest tests/unit -q
