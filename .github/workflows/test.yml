name: PAW Verification Pipeline (TASK-G-03)

on:
  push:
    branches: [ main, 'codex/**', 'claude/**', 'gemini/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Standalone Installer
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.12.0

      - name: Build Standalone Installer
        run: |
          python scripts/package_app.py

      - name: Generate Installer SHA256 Text File
        shell: pwsh
        run: |
          $exe = "dist/PAW_Personal_Work_OS_Setup_v2.5.0.exe"
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash
          "$hash  PAW_Personal_Work_OS_Setup_v2.5.0.exe" | Out-File -FilePath "dist/PAW_Personal_Work_OS_Setup_v2.5.0.exe.sha256" -Encoding ascii
          Get-Content "dist/PAW_Personal_Work_OS_Setup_v2.5.0.exe.sha256"

      - name: Upload Built Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-installer-exe
          path: |
            dist/PAW_Personal_Work_OS_Setup_v2.5.0.exe
            dist/PAW_Personal_Work_OS_Setup_v2.5.0.exe.sha256
          if-no-files-found: error
          retention-days: 5

  real-model-smoke:
    name: Real Model Acceptance Smoke (Freeform Mock)
    runs-on: windows-latest
    needs: build
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONPATH: .

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Smoke Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx python-docx python-pptx

      - name: Download Built Installer
        uses: actions/download-artifact@v4
        with:
          name: built-installer-exe
          path: installer_artifact

      - name: Start Freeform Mock Model Server
        shell: pwsh
        run: |
          $env:PAW_MOCK_MODE = 'freeform'
          Start-Process -FilePath "python" -ArgumentList "$PWD\scripts\mock_openai_server.py --port 18000" -WorkingDirectory $PWD -WindowStyle Hidden
          $retries = 20
          while ($retries -gt 0) {
            try {
              $res = Invoke-RestMethod -Uri "http://127.0.0.1:18000/health" -TimeoutSec 2
              if ($res.status -eq "ok") { Write-Host "Freeform mock server is live."; break }
            } catch {}
            Start-Sleep -Seconds 1
            $retries--
          }
          if ($retries -eq 0) { throw "Freeform mock server did not start." }

      - name: Run Complete Real Model Acceptance Flow Against Mock
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          $installer = (Get-ChildItem -Path installer_artifact\*.exe)[0].FullName
          python -m tests.run_real_model_acceptance --installer $installer --report reports/real-model-report.json --mock-smoke
          if ($LASTEXITCODE -ne 0) { throw "Acceptance smoke script exited with code $LASTEXITCODE." }
          if (-not (Test-Path reports/real-model-report.json)) { throw "Acceptance report was not generated." }
          $report = Get-Content reports/real-model-report.json -Raw -Encoding utf8 | ConvertFrom-Json
          if (@($report.questions).Count -ne 8) { throw "Expected 8 completed question entries in the acceptance report." }
          if (@($report.questions | Where-Object { -not $_.answer }).Count -ne 0) { throw "Expected mock answers for all 8 questions." }

  test-blocks:
    name: Test Block ${{ matrix.block }}
    runs-on: windows-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        block: [B1, B2, B3, B4, B5, B6, B7, B8, PM02, PM03, PM04, PM05, PM06, PM07, PM08, PM09, PM10, PM12]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONPATH: .

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Block Real AI Endpoints in Hosts File
        shell: pwsh
        run: |
          $hostsPath = "C:\Windows\System32\drivers\etc\hosts"
          $entries = "`r`n0.0.0.0 api.anthropic.com`r`n0.0.0.0 api.openai.com`r`n0.0.0.0 api.deepseek.com`r`n0.0.0.0 dashscope.aliyuncs.com"
          Add-Content -Path $hostsPath -Value $entries
          Write-Host "=== Updated Hosts File Security Barrier ==="
          Get-Content $hostsPath | Select-Object -Last 6

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx python-docx openpyxl python-pptx pypdf pillow playwright jsonschema==4.23.0
          playwright install chromium

      - name: Download Built Installer
        uses: actions/download-artifact@v4
        with:
          name: built-installer-exe
          path: installer_artifact

      - name: Download Baseline for Overlay Upgrade
        if: matrix.block == 'PM07'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path baseline_pm -Force | Out-Null
          gh release download v2.3.9-baseline --repo ${{ github.repository }} --pattern '*.exe' --dir baseline_pm

      - name: Start Mock Model Server
        shell: pwsh
        run: |
          # The standard exam reads documents and must see the kind of answer a
          # real model gives, so it runs the stand-in in extractive mode.  Every
          # other block keeps the scripted mode its cases are written against.
          $mockMode = if ('${{ matrix.block }}' -eq 'PM10') { 'extractive' } elseif ('${{ matrix.block }}' -eq 'PM12') { 'freeform' } else { 'scripted' }
          Write-Host "Mock mode: $mockMode"
          $env:PAW_MOCK_MODE = $mockMode
          Start-Process -FilePath "python" -ArgumentList "$PWD\scripts\mock_openai_server.py --port 18000" -WorkingDirectory $PWD -WindowStyle Hidden
          $retries = 15
          while ($retries -gt 0) {
            try {
              $res = Invoke-RestMethod -Uri "http://127.0.0.1:18000/health" -TimeoutSec 2
              if ($res.status -eq "ok") { Write-Host "Mock OpenAI Server is live ($mockMode mode)!"; break }
            } catch {}
            Start-Sleep -Seconds 1
            $retries--
          }

      - name: Generate Test Fixtures
        run: |
          python scripts/generate_fixtures.py

      - name: Execute Block Test (${{ matrix.block }})
        shell: pwsh
        run: |
          chcp 65001
          $installer = (Get-ChildItem -Path installer_artifact\*.exe)[0].FullName
          Write-Host "Target Installer: $installer"
          mkdir -p reports
          python tests/run_e2e_tests.py --block ${{ matrix.block }} --installer-exe $installer --commit-sha ${{ github.sha }} --model-mode mock-llm --output-report reports/report_${{ matrix.block }}.json

      - name: Verify cross-pipeline source completion
        if: always() && matrix.block == 'PM02'
        run: python scripts/verify_source_completion.py

      - name: Scan Artifacts for Credential Leaks
        if: always()
        run: |
          python scripts/scan_secrets_leak.py --scan-dir . --secret-value "${{ secrets.AGY_CREDENTIAL }}"

      - name: Collect Scan Diagnostics (redacted)
        id: collect_scan
        if: failure()
        shell: pwsh
        run: |
          chcp 65001
          $out = 'scan_diagnostics'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $data = Join-Path $env:LOCALAPPDATA 'PAW'
          if (Test-Path (Join-Path $data 'logs')) { Copy-Item (Join-Path $data 'logs') (Join-Path $out 'logs') -Recurse -Force }
          foreach ($name in @('scan_checkpoint.json', 'workspace.db')) {
            $p = Join-Path $data $name
            if (Test-Path $p) { Copy-Item $p (Join-Path $out $name) -Force }
          }
          $mirror = Join-Path $env:TEMP 'scan-diagnostics'
          if (Test-Path $mirror) { Copy-Item $mirror (Join-Path $out 'mirror') -Recurse -Force }
          $old_mirror = Join-Path $env:TEMP 'paw-scan-diagnostics'
          if (Test-Path $old_mirror) { Copy-Item $old_mirror (Join-Path $out 'mirror-old') -Recurse -Force }
          # A frozen build may redirect TEMP into its own extraction directory;
          # take any application log the job can still see.
          New-Item -ItemType Directory -Force -Path (Join-Path $out 'stray-logs') | Out-Null
          Get-ChildItem -Path $env:TEMP -Recurse -Filter 'paw-desktop.log' -ErrorAction SilentlyContinue |
            Copy-Item -Destination (Join-Path $out 'stray-logs') -Force
          Get-ChildItem -Recurse $out | Select-Object FullName, Length | Format-Table -AutoSize
          python scripts/check_scan_diagnostics.py --dir $out

      - name: Upload Scan Diagnostics
        if: failure() && steps.collect_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: scan-diagnostics-${{ matrix.block }}-attempt-${{ github.run_attempt }}
          path: scan_diagnostics/
          if-no-files-found: ignore
          retention-days: 10

      - name: Upload Block Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.block }}-attempt-${{ github.run_attempt }}
          path: reports/report_${{ matrix.block }}.json
          retention-days: 5

      - name: Upload Exam Results
        if: always() && matrix.block == 'PM10'
        uses: actions/upload-artifact@v4
        with:
          name: exam-results
          path: reports/exam_result.json
          if-no-files-found: ignore
          retention-days: 10

      - name: Upload Block Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.block }}-attempt-${{ github.run_attempt }}
          path: screenshots/
          retention-days: 5

  negative-control:
    name: Negative Controls (NC-01, NC-02, NC-03)
    runs-on: windows-latest
    needs: build
    continue-on-error: true
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Block Real AI Endpoints in Hosts File
        shell: pwsh
        run: |
          $hostsPath = "C:\Windows\System32\drivers\etc\hosts"
          $entries = "`r`n0.0.0.0 api.anthropic.com`r`n0.0.0.0 api.openai.com`r`n0.0.0.0 api.deepseek.com`r`n0.0.0.0 dashscope.aliyuncs.com"
          Add-Content -Path $hostsPath -Value $entries
          Write-Host "=== Updated Hosts File Security Barrier ==="
          Get-Content $hostsPath | Select-Object -Last 6

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx python-docx openpyxl python-pptx pypdf pillow playwright jsonschema==4.23.0
          playwright install chromium

      - name: Download Baseline v2.3.7 Installer from Release
        shell: pwsh
        run: |
          mkdir -p baseline_installer
          gh release download v2.3.7-baseline --repo ${{ github.repository }} --dir baseline_installer

      - name: Download Baseline v2.5.0 Governance Negative Control
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path baseline_pm -Force | Out-Null
          gh release download v2.3.9-baseline --repo ${{ github.repository }} --pattern '*.exe' --dir baseline_pm

      - name: Download v2.5.0-rc1 Negative Control Baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path baseline_c12 -Force | Out-Null
          gh release download v2.5.0-rc1-baseline --repo ${{ github.repository }} --pattern '*.exe' --dir baseline_c12

      - name: Download Built Installer
        uses: actions/download-artifact@v4
        with:
          name: built-installer-exe
          path: installer_artifact

      - name: Start Mock Model Server
        shell: pwsh
        run: |
          Start-Process -FilePath "python" -ArgumentList "$PWD\scripts\mock_openai_server.py --port 18000" -WorkingDirectory $PWD -WindowStyle Hidden
          $retries = 15
          while ($retries -gt 0) {
            try {
              $res = Invoke-RestMethod -Uri "http://127.0.0.1:18000/health" -TimeoutSec 2
              if ($res.status -eq "ok") { Write-Host "Mock OpenAI Server is live!"; break }
            } catch {}
            Start-Sleep -Seconds 1
            $retries--
          }

      - name: Generate Test Fixtures
        run: |
          python scripts/generate_fixtures.py

      - name: Execute Negative Control Tests
        shell: pwsh
        run: |
          chcp 65001
          $baseline = (Get-ChildItem -Path baseline_installer\*.exe)[0].FullName
          $current = (Get-ChildItem -Path installer_artifact\*.exe)[0].FullName
          Write-Host "Baseline 2.3.7 Installer: $baseline"
          Write-Host "Current 2.5.0 Installer: $current"
          mkdir -p reports
          python tests/run_e2e_tests.py --block NEGATIVE-CONTROL --installer-exe $current --baseline-exe $baseline --commit-sha ${{ github.sha }} --model-mode mock-llm --output-report reports/report_negative_control.json

      - name: Execute PM Governance Negative Control
        shell: pwsh
        run: |
          $baselinePm = (Get-ChildItem -Path baseline_pm\*.exe)[0].FullName
          python tests/run_pm_tests.py --installer-exe $baselinePm --commit-sha ${{ github.sha }} --output-report reports/report_negative_pm.json

      - name: Execute PM Version Negative Control
        shell: pwsh
        run: |
          $baselinePm = (Get-ChildItem -Path baseline_pm\*.exe)[0].FullName
          python tests/run_pm_tests.py --version-negative --installer-exe $baselinePm --commit-sha ${{ github.sha }} --output-report reports/report_negative_pm_version.json

      - name: Execute PM Cockpit Negative Control
        shell: pwsh
        run: |
          $baselinePm = (Get-ChildItem -Path baseline_pm\*.exe)[0].FullName
          python tests/run_pm_tests.py --cockpit-negative --installer-exe $baselinePm --commit-sha ${{ github.sha }} --output-report reports/report_negative_pm_cockpit.json

      - name: Switch Mock Server to Generic Freeform Mode for C-12
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" |
            Where-Object { $_.CommandLine -like '*mock_openai_server.py*--port 18000*' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          $env:PAW_MOCK_MODE = 'freeform'
          Start-Process -FilePath "python" -ArgumentList "$PWD\scripts\mock_openai_server.py --port 18000" -WorkingDirectory $PWD -WindowStyle Hidden
          $retries = 15
          while ($retries -gt 0) {
            try {
              $res = Invoke-RestMethod -Uri "http://127.0.0.1:18000/health" -TimeoutSec 2
              if ($res.status -eq "ok") { Write-Host "Mock OpenAI Server is live (freeform mode)!"; break }
            } catch {}
            Start-Sleep -Seconds 1
            $retries--
          }
          if ($retries -eq 0) { throw "Freeform mock server did not start." }

      - name: Execute C-12 Baseline Negative Controls
        shell: pwsh
        run: |
          $baselineC12 = (Get-ChildItem -Path baseline_c12\*.exe)[0].FullName
          python tests/run_pm_tests.py --c12-negative --installer-exe $baselineC12 --commit-sha ${{ github.sha }} --output-report reports/report_negative_c12.json

      - name: Scan Artifacts for Credential Leaks
        if: always()
        run: |
          python scripts/scan_secrets_leak.py --scan-dir . --secret-value "${{ secrets.AGY_CREDENTIAL }}"

      - name: Upload Negative Control Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-negative-control-attempt-${{ github.run_attempt }}
          path: reports/
          retention-days: 5

      - name: Upload Negative Control Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-negative-control-attempt-${{ github.run_attempt }}
          path: screenshots/
          retention-days: 5

  summary:
    name: Reviewer Verdict Gate
    runs-on: windows-latest
    needs: [test-blocks, negative-control]
    if: always()
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download All Block Reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-*-attempt-${{ github.run_attempt }}
          path: all_reports
          merge-multiple: true

      - name: Execute Reviewer Verdict Gate
        shell: pwsh
        run: |
          chcp 65001
          Get-ChildItem all_reports -Recurse
          python tests/paw_verdict.py all_reports ${{ github.sha }} summary.md

      - name: Diagnose Reused Screenshot Sources
        if: always()
        shell: pwsh
        run: |
          @'
          import json
          from collections import defaultdict
          from pathlib import Path

          reports = Path("all_reports")
          sources = defaultdict(list)
          for path in sorted(reports.rglob("*.json")) if reports.exists() else []:
              try:
                  report = json.loads(path.read_text(encoding="utf-8-sig"))
              except Exception:
                  continue
              block = str(report.get("block") or "unknown")
              for case in report.get("cases", []):
                  case_id = str(case.get("id") or "unknown")
                  for shot in case.get("screens", []):
                      digest = str(shot.get("sha256") or "")
                      if digest:
                          sources[digest].append((case_id, str(shot.get("file") or "unknown"), block))

          duplicates = [(digest, rows) for digest, rows in sorted(sources.items()) if len(rows) > 1]
          lines = ["## Duplicate screenshot sources", ""]
          if duplicates:
              lines.extend(f"- `{digest[:12]}` → " + "; ".join(
                  f"case `{case_id}`, file `{filename}`, block `{block}`"
                  for case_id, filename, block in rows
              ) for digest, rows in duplicates)
          else:
              lines.append("No duplicate screenshot hashes were found in the available report files.")

          summary = Path("summary.md")
          if summary.exists():
              with summary.open("a", encoding="utf-8") as stream:
                  stream.write("\n\n" + "\n".join(lines) + "\n")
          print("\n".join(lines))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { Write-Warning "Screenshot diagnostics failed; reviewer verdict remains unchanged." }

      - name: Publish Reviewer Verdict to Job Summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path summary.md) {
            Get-Content summary.md -Raw -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "Reviewer verdict did not produce summary.md; see the failed gate step." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload Pipeline Verdict Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-verdict-summary
          path: summary.md
          retention-days: 10
