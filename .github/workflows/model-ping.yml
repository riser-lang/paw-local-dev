name: Model Ping

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-ping:
    if: github.repository == 'riser-lang/paw-local-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run four model connectivity requests
        env:
          PAW_TEST_API_KEY: ${{ secrets.PAW_TEST_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import socket
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          BASE_URL = "https://api.siliconflow.cn/v1"
          MODEL = "deepseek-ai/DeepSeek-V4.1-Flash"
          API_KEY = os.environ.get("PAW_TEST_API_KEY", "")
          REPORT_PATH = Path("model-ping-report.json")


          def redact(value):
              text = str(value or "")
              if API_KEY:
                  text = text.replace(API_KEY, "[REDACTED]")
              return text[:1000]


          def error_details(body):
              try:
                  payload = json.loads(body.decode("utf-8", errors="replace"))
              except Exception:
                  return {"code": None, "message": "HTTP request failed"}
              err = payload.get("error", payload)
              if not isinstance(err, dict):
                  return {"code": None, "message": "HTTP request failed"}
              return {
                  "code": redact(err.get("code")),
                  "message": redact(err.get("message")),
              }


          def request(label, path, method="GET", payload=None, check_model=False):
              started = time.monotonic()
              result = {
                  "request": label,
                  "status_code": None,
                  "elapsed_seconds": None,
                  "timed_out": False,
              }
              if payload is not None:
                  body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
              else:
                  body = None
              headers = {"Authorization": f"Bearer {API_KEY}"}
              if body is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  BASE_URL + path, data=body, headers=headers, method=method
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      result["status_code"] = response.status
                      response_body = response.read()
                  result["elapsed_seconds"] = round(time.monotonic() - started, 3)
                  if not 200 <= result["status_code"] < 300:
                      result["error"] = error_details(response_body)
                  elif check_model:
                      try:
                          models = json.loads(response_body.decode("utf-8"))
                          ids = {
                              item.get("id")
                              for item in models.get("data", [])
                              if isinstance(item, dict)
                          }
                          result["model_present"] = MODEL in ids
                      except Exception:
                          result["model_present"] = False
                  else:
                      response_json = json.loads(response_body.decode("utf-8"))
                      choices = response_json.get("choices", [])
                      answer = ""
                      if choices:
                          answer = choices[0].get("message", {}).get("content", "")
                          if not isinstance(answer, str):
                              answer = json.dumps(answer, ensure_ascii=False)
                      result["answer_first_100"] = redact(answer)[:100]
                      usage = response_json.get("usage") or {}
                      result["usage"] = {
                          "prompt_tokens": usage.get("prompt_tokens"),
                          "completion_tokens": usage.get("completion_tokens"),
                          "reasoning_tokens": usage.get("reasoning_tokens")
                          or (usage.get("completion_tokens_details") or {}).get("reasoning_tokens"),
                      }
              except urllib.error.HTTPError as exc:
                  result["status_code"] = exc.code
                  try:
                      result["error"] = error_details(exc.read())
                  except Exception:
                      result["error"] = {"code": None, "message": "HTTP request failed"}
                  result["elapsed_seconds"] = round(time.monotonic() - started, 3)
              except (TimeoutError, socket.timeout) as exc:
                  result["timed_out"] = True
                  result["elapsed_seconds"] = round(time.monotonic() - started, 3)
                  result["error"] = {"code": type(exc).__name__, "message": redact(exc)}
              except Exception as exc:
                  result["elapsed_seconds"] = round(time.monotonic() - started, 3)
                  result["error"] = {"code": type(exc).__name__, "message": redact(exc)}
              return result


          def fictional_sample():
              locations = ["雾杉湾", "白石岭", "青禾港", "月汀村", "松风台", "栖云岛"]
              activities = ["潮汐观测", "种子交换", "灯塔维护", "步道巡查", "雨量记录", "旧桥修缮"]
              details = [
                  "记录员把当天的变化写在蓝色册页里，并注明观察时间。",
                  "几位居民先核对工具，再沿着石阶慢慢检查现场。",
                  "临时木牌只用于说明方向，正式安排仍由小组讨论决定。",
                  "午后的海风带来薄雾，队伍因此把休息点移到屋檐下。",
                  "收工前大家清点物资，把可重复使用的物品放回储物柜。",
                  "这份故事属于虚构的岛屿与人物，不描述任何真实项目。",
                ]
              paragraphs = []
              for index in range(1, 25):
                  place = locations[(index - 1) % len(locations)]
                  activity = activities[(index - 1) % len(activities)]
                  paragraphs.append(
                      f"第{index}天，{place}的小组安排了{activity}。"
                      + "".join(details[(index + offset) % len(details)] for offset in range(4))
                  )
              sample = "\n".join(paragraphs)
              return sample[:2000]


          report = {
              "model": MODEL,
              "timeout_seconds": 120,
              "requests": [],
          }
          if not API_KEY:
              report["setup_error"] = "PAW_TEST_API_KEY secret is not configured"
          else:
              report["requests"].append(
                  request("GET /models", "/models", check_model=True)
              )

              prompt = "只回复：连通正常"
              report["requests"].append(
                  request(
                      "POST /chat/completions (default parameters)",
                      "/chat/completions",
                      method="POST",
                      payload={
                          "model": MODEL,
                          "messages": [{"role": "user", "content": prompt}],
                          "max_tokens": 50,
                      },
                  )
              )
              report["requests"].append(
                  request(
                      "POST /chat/completions (enable_thinking=false)",
                      "/chat/completions",
                      method="POST",
                      payload={
                          "model": MODEL,
                          "messages": [{"role": "user", "content": prompt}],
                          "max_tokens": 50,
                          "enable_thinking": False,
                      },
                  )
              )
              long_prompt = (
                  "以下是约 2000 字的虚构中文样例。请只依据样例，输出一个 JSON 数组，"
                  "包含 2 个对象，每个对象有 place 和 activity 字段，不要附加解释。\n\n"
                  + fictional_sample()
              )
              report["requests"].append(
                  request(
                      "POST /chat/completions (long fictional Chinese sample)",
                      "/chat/completions",
                      method="POST",
                      payload={
                          "model": MODEL,
                          "messages": [{"role": "user", "content": long_prompt}],
                          "max_tokens": 1500,
                          "enable_thinking": False,
                      },
                  )
              )

          REPORT_PATH.write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload model ping report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-ping-report
          path: model-ping-report.json
          if-no-files-found: error
